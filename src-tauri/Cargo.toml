[package]
name = "git-workspace"
version = "0.1.0"
description = "High-performance multi-repository Git visual management platform"
authors = ["wangyi", "GitWorkspace"]
edition = "2021"

[lib]
name = "git_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enables the tauri custom protocol to serve the embedded frontend in
# release builds. Without this, release builds fall back to the devUrl.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
git2 = { version = "0.19", features = ["ssh", "https"] }
tokio = { version = "1", features = ["full"] }
notify = "7"
notify-debouncer-full = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
walkdir = "2.5"
dashmap = "6"
moka = { version = "0.12", features = ["sync"] }
log = "0.4"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1.10", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# AI-01（§6.4）：OS Credential Store——Windows Credential Manager / macOS
# Keychain / Linux Secret Service。默认特性即三平台原生后端
# （apple-native / windows-native / sync-secret-service）。
keyring = { version = "3", default-features = true }
regex = "1"
sysinfo = "0.30"
quick-xml = "0.41"
# F-11：pathing jar（写 META-INF/MANIFEST.MF 的 stub jar）。zip 已是传递
# 依赖，提升为直接依赖即可，无新增编译量；Stored 压缩无需默认 features。
zip = { version = "4.6", default-features = false }
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
sha2 = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1"
base64 = "0.22"
rcgen = "0.13"
quinn = { version = "0.11", default-features = false, features = ["rustls", "ring", "runtime-tokio", "log"] }
postcard = { version = "1", features = ["alloc"] }
mdns-sd = "0.21.1"

# F-06：仅 Windows 需要——tao/Tauri 的 set_icon 只设置窗口小图标
# （WM_SETICON ICON_SMALL），任务栏大图标（ICON_BIG）需自己发消息设置。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# N-07：launch 子进程独立进程组（CommandExt::process_group）+ killpg 整组
# 终止——SIGTERM 后 npm 先退、vite 被 reparent 后 parent 链 kill_tree 杀不到
# （设计文档 §9 风险实锤），组信号才能保证 Stop 后端口真实释放。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS：universal 构建的 x86_64 交叉腿找不到系统 OpenSSL（runner 上 brew
# 只装得到 arm64 库，pkg-config 不支持交叉），git2 的 https 传输在 macOS
# 改用 vendored OpenSSL（按目标架构从源码编译）。Windows 走 WinHTTP、
# Linux 用系统 OpenSSL，均不受影响（features 按目标平台取并集）。
[target.'cfg(target_os = "macos")'.dependencies]
git2 = { version = "0.19", features = ["ssh", "https", "vendored-openssl"] }

[profile.release]
# panic 策略改为默认 unwind：abort 会把任意一处 panic（如 AI 命令层对
# 多字节内容的字节切片）直接变成整个应用退出（Windows 用户实测）。
# unwind 下 Tauri 命令把 panic 转为失败返回，应用保持存活。
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
