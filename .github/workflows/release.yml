name: Release
run-name: Release ${{ github.ref_name }}

# 触发条件：
#   1) 推送 v* tag 时自动发布正式版（如 v0.1.0）
#   2) 手动触发（Actions → Release → Run workflow），构建草稿用于测试打包流程
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 允许 tauri-action 创建 Release 并上传产物

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 计算版本号：tag 触发时取 tag 去掉 v 前缀；手动触发时用 dev 版本号避免重复
      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # 把版本号同步进 tauri.conf.json，避免多个版本产物版本号重复
      - name: Sync version into tauri.conf.json
        shell: bash
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp \
            && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          echo "::group::Updated tauri.conf.json"
          cat src-tauri/tauri.conf.json
          echo "::endgroup::"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri Updater 签名密钥（可选）：用于自动更新时验证安装包完整性。
          # 注意：这是 Tauri 更新器签名，并非 Windows Authenticode 代码签名，
          #       不能消除 SmartScreen "未知发布者" 警告（详见 README）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: 'GitWorkspace v${{ steps.version.outputs.version }}'
          # tag 推送时直接发布；手动触发时作为草稿，便于人工审核
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
